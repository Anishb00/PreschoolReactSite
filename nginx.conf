upstream next_upstream {
  server web:3000;
  keepalive 64;
}

# Port 80: ACME + redirects for secondary/admin domains
server {
  listen 80;
  server_name steppingstoneworld.com www.steppingstoneworld.com steppingstoneworldpreschool.com www.steppingstoneworldpreschool.com admin.steppingstoneworld.com;

  location ^~ /.well-known/acme-challenge/ {
    alias /var/www/certbot/.well-known/acme-challenge/;
    try_files $uri =404;
  }

  # redirect secondary + admin domains to HTTPS canonical host
  if ($host ~* ^(steppingstoneworldpreschool\.com|www\.steppingstoneworldpreschool\.com)$) {
    return 301 https://steppingstoneworld.com$request_uri;
  }
  if ($host = admin.steppingstoneworld.com) {
    return 301 https://admin.steppingstoneworld.com$request_uri;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# Port 443: main site
server {
  listen 443 ssl http2;
  server_name steppingstoneworld.com www.steppingstoneworld.com;

  ssl_certificate     /etc/letsencrypt/live/steppingstoneworld.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/steppingstoneworld.com/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;

  client_max_body_size 20m;

  location ^~ /.well-known/acme-challenge/ {
    alias /var/www/certbot/.well-known/acme-challenge/;
    try_files $uri =404;
  }

  # Block /admin on the main domain (admin only lives on admin subdomain)
  location ^~ /admin {
    return 404;
  }

  location / {
    proxy_pass http://next_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}

# Port 443: admin subdomain -> /admin/ app path
server {
  listen 443 ssl http2;
  server_name admin.steppingstoneworld.com;

  ssl_certificate     /etc/letsencrypt/live/steppingstoneworld.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/steppingstoneworld.com/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;

  client_max_body_size 20m;

  location ^~ /.well-known/acme-challenge/ {
    alias /var/www/certbot/.well-known/acme-challenge/;
    try_files $uri =404;
  }

  # map / on admin subdomain to /admin/ path in Next.js app
  location / {
    proxy_pass http://next_upstream/admin/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}

# Port 443: redirect secondary domain to canonical
server {
  listen 443 ssl http2;
  server_name steppingstoneworldpreschool.com www.steppingstoneworldpreschool.com;

  ssl_certificate     /etc/letsencrypt/live/steppingstoneworld.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/steppingstoneworld.com/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;

  return 301 https://steppingstoneworld.com$request_uri;
}
