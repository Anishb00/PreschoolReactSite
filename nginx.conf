upstream next_upstream {
  server web:3000;
  keepalive 64;
}

# Port 80: primary + redirect for secondary domain
server {
  listen 80;
  server_name steppingstoneworld.com www.steppingstoneworld.com;

  location ^~ /.well-known/acme-challenge/ {
    alias /var/www/certbot/.well-known/acme-challenge/;
    try_files $uri =404;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 80;
  server_name steppingstoneworldpreschool.com www.steppingstoneworldpreschool.com;
  return 301 https://steppingstoneworld.com$request_uri;
}

# Port 443: main site + redirect from secondary
server {
  listen 443 ssl http2;
  server_name steppingstoneworld.com www.steppingstoneworld.com;

  ssl_certificate     /etc/letsencrypt/live/steppingstoneworld.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/steppingstoneworld.com/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;

  client_max_body_size 20m;

  location ^~ /.well-known/acme-challenge/ {
    alias /var/www/certbot/.well-known/acme-challenge/;
    try_files $uri =404;
  }

  location / {
    proxy_pass http://next_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}

server {
  listen 443 ssl http2;
  server_name steppingstoneworldpreschool.com www.steppingstoneworldpreschool.com;

  ssl_certificate     /etc/letsencrypt/live/steppingstoneworld.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/steppingstoneworld.com/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;

  return 301 https://steppingstoneworld.com$request_uri;
}
