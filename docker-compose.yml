services:
  web:
    build: .
    image: preschoolreactsite
    container_name: preschoolreactsite-web

    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

    expose:
      - "3000"
    networks:
      - appnet

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

    depends_on:
      db:
        condition: service_healthy

  web-dev:
    image: node:20-bullseye
    container_name: preschoolreactsite-web-dev
    working_dir: /app
    command: sh -c "npm install && NEXT_DISABLE_TURBOPACK=1 npm run dev -- --hostname 0.0.0.0 --port 3000"
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SES_REGION: ${SES_REGION}
      SES_SOURCE_EMAIL: ${SES_SOURCE_EMAIL}
      APP_BASE_URL: ${APP_BASE_URL}
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    networks:
      - appnet
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: mysql-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    # ports:
    #   - "127.0.0.1:3306:3306" # remove if you want to use app outside of docker containers
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sqlScripts/Schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sqlScripts/better-auth-tables.sql:/docker-entrypoint-initdb.d/02-better-auth.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p${DB_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - appnet

  nginx:
    image: nginx:1.25-alpine
    container_name: nginx-proxy
    depends_on:
      - web
    ports:
      - "80:80"
      # - "443:443" # enable after TLS setup
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./nginx/certs:/etc/nginx/certs:ro   # TLS certs later
    networks:
      - appnet

networks:
  appnet:
    driver: bridge

volumes:
  mysql_data:
    external: true
    name: preschool_mysql_data
