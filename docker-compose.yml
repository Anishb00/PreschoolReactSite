services:
  web:
    build: .
    image: preschoolreactsite
    container_name: preschoolreactsite-web

    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

    expose:
      - "3000"
    networks:
      - appnet

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: mysql-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sqlScripts/Schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sqlScripts/better-auth-tables.sql:/docker-entrypoint-initdb.d/02-better-auth.sql:ro
    healthcheck:
      test: [
        "CMD-SHELL",
        "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent \
        && (c=$$(cat /tmp/healthcount 2>/dev/null || echo 0); c=$$((c+1)); echo $$c >/tmp/healthcount; [ $$c -ge 3 ]) \
        || (rm -f /tmp/healthcount; exit 1)"
      ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - appnet

  nginx:
    image: nginx:1.25-alpine
    container_name: nginx-proxy
    depends_on:
      - web
    ports:
      - "80:80"
      # - "443:443" # enable after TLS setup
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./nginx/certs:/etc/nginx/certs:ro   # TLS certs later
    networks:
      - appnet

networks:
  appnet:
    driver: bridge

volumes:
  mysql_data:
    external: true
    name: preschool_mysql_data
